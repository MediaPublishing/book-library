name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes html-validate@9.7.1 site/index.html
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package:release
      - run: git diff --exit-code -- site/download
